name: Windows installers

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-installers.yml'
      - 'apps/desktop/**'
      - 'packages/engine/**'
      - 'src/**'
      - 'package-lock.json'
      - 'desktop.html'
      - 'vite.config.ts'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - run: npm ci
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match v$version" }
      - name: Test Windows app
        run: cargo +stable test --locked --target x86_64-pc-windows-msvc --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build NSIS and MSI
        run: npm run desktop:build -- --target x86_64-pc-windows-msvc --bundles nsis,msi --ci
      - name: Name and verify installers
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $root = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $output = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/versa-installers" -Force
          $exe = Get-ChildItem "$root/nsis/*.exe" -File | Select-Object -First 1
          $msi = Get-ChildItem "$root/msi/*.msi" -File | Select-Object -First 1
          if (-not $exe -or -not $msi) { throw 'One or both installers are missing' }
          Copy-Item $exe.FullName "$output/Versa-Setup-$version.exe"
          Copy-Item $msi.FullName "$output/Versa-$version-x64.msi"
          Get-ChildItem $output -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Path "$output/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: versa-windows-x64
          path: ${{ runner.temp }}/versa-installers/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: versa-windows-x64
          path: installers
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd installers
          sha256sum -c SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "Versa-Setup-$version.exe" "Versa-$version-x64.msi" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Versa $GITHUB_REF_NAME" --latest

  verify-site:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSA_DEPLOYMENT_URL: https://versa.danielpro.dev/
      VERSA_EXPECT_INSTALLER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the worker deployed on nginx
        run: npm test -- tests/deployment.spec.ts
